<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="15%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="90%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="25%" stop-color="#CA8A04"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="goldBarsE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Emerald Gradients -->
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="30%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="85%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="emeraldVibrant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Shadow and Glow Filters -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#011f18" flood-opacity="0.38"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#b45309" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. TOP CIRCULAR MEDAL / CHAT BUBBLE EMBLEM               -->
  <!-- ======================================================== -->
  <g id="top-emblem" filter="url(#shadow3D)">
    <!-- Speech Bubble Pointer (Bottom-Left) -->
    <path d="M 330 380 L 260 455 C 252 464 265 473 275 464 L 380 405 Z" 
          fill="url(#goldLinear)" />
    <path d="M 333 382 L 270 448 C 266 453 273 457 278 453 L 375 403 Z" 
          fill="url(#emeraldDark)" />

    <!-- Outer Gold Medal Ring -->
    <circle cx="400" cy="235" r="200" fill="none" stroke="url(#goldLinear)" stroke-width="26" />
    <circle cx="400" cy="235" r="187" fill="none" stroke="#FEF08A" stroke-width="3" opacity="0.8" />

    <!-- Emerald Crescent Shell Wrapping Top & Left -->
    <path d="M 220 235 A 180 180 0 0 1 540 120 A 180 180 0 0 0 250 330 Z" 
          fill="url(#emeraldDark)" opacity="0.9" />

    <!-- Inner Emerald Ring -->
    <circle cx="400" cy="235" r="172" fill="url(#emeraldDark)" />
    <circle cx="400" cy="235" r="170" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.5" />

    <!-- Center White Background Disc -->
    <circle cx="400" cy="235" r="148" fill="#FFFFFF" />

    <!-- 3 Stylized Human Figures (Society / Stakeholders) -->
    <!-- Left Person -->
    <g opacity="0.95">
      <circle cx="340" cy="180" r="22" fill="url(#emeraldVibrant)" />
      <path d="M 305 255 C 305 210 365 210 365 255 Z" fill="url(#emeraldVibrant)" />
    </g>

    <!-- Right Person -->
    <g opacity="0.95">
      <circle cx="455" cy="180" r="22" fill="url(#emeraldVibrant)" />
      <path d="M 420 255 C 420 210 485 210 485 255 Z" fill="url(#emeraldVibrant)" />
    </g>

    <!-- Center Person (Elevated & Prominent) -->
    <g filter="url(#shadow3D)">
      <circle cx="400" cy="150" r="30" fill="url(#emeraldVibrant)" stroke="#FFFFFF" stroke-width="4.5" />
      <path d="M 358 255 C 358 198 442 198 442 255 Z" fill="url(#emeraldVibrant)" stroke="#FFFFFF" stroke-width="4.5" />
    </g>

    <!-- 3 Rising Performance Bars (Growth / Standard) -->
    <!-- Bar 1 (Left) -->
    <g filter="url(#shadow3D)">
      <rect x="375" y="235" width="34" height="90" rx="6" fill="url(#emeraldVibrant)" stroke="url(#goldLinear)" stroke-width="3" />
      <path d="M 377 238 L 407 238" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Bar 2 (Middle) -->
    <g filter="url(#shadow3D)">
      <rect x="420" y="195" width="36" height="130" rx="6" fill="url(#emeraldVibrant)" stroke="url(#goldLinear)" stroke-width="3.5" />
      <path d="M 422 198 L 454 198" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Bar 3 (Right, High) -->
    <g filter="url(#shadow3D)">
      <rect x="468" y="150" width="40" height="175" rx="7" fill="url(#emeraldVibrant)" stroke="url(#goldLinear)" stroke-width="4" />
      <path d="M 470 154 L 506 154" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Grand 3D Golden Checkmark Swooping Outside Circle -->
    <g filter="url(#goldGlow)">
      <!-- Main Checkmark Body -->
      <path d="M 410 270 L 465 325 C 469 329 475 329 479 324 L 635 105 C 640 98 630 90 622 96 L 472 284 L 424 238 C 417 232 404 240 410 270 Z" 
            fill="url(#goldHighlight)" stroke="#FFFBEB" stroke-width="3.5" />
      <!-- Center Specular Highlight Line -->
      <path d="M 420 256 L 472 308 L 626 100" 
            fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
      <!-- Bevel Shadow Edge -->
      <path d="M 472 318 L 632 108" 
            fill="none" stroke="#854D0E" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 2. TYPOGRAPHY "M O N E V"                                 -->
  <!-- ======================================================== -->
  <g id="typography-monev" transform="translate(68, 440)" filter="url(#shadow3D)">
    <!-- Letter 'M' -->
    <path d="M 12 110 L 12 0 L 42 0 L 68 62 L 94 0 L 124 0 L 124 110 L 98 110 L 98 36 L 76 86 L 60 86 L 38 36 L 38 110 Z" 
          fill="url(#emeraldDark)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <path d="M 12 110 L 12 0 L 42 0 L 68 62 L 94 0 L 124 0 L 124 110 L 98 110 L 98 36 L 76 86 L 60 86 L 38 36 L 38 110 Z" 
          fill="url(#emeraldDark)" />

    <!-- Letter 'O' -->
    <path d="M 194 0 C 158 0 138 25 138 55 C 138 85 158 110 194 110 C 230 110 250 85 250 55 C 250 25 230 0 194 0 Z M 194 28 C 208 28 216 39 216 55 C 216 71 208 82 194 82 C 180 82 172 71 172 55 C 172 39 180 28 194 28 Z" 
          fill="url(#emeraldDark)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <path d="M 194 0 C 158 0 138 25 138 55 C 138 85 158 110 194 110 C 230 110 250 85 250 55 C 250 25 230 0 194 0 Z M 194 28 C 208 28 216 39 216 55 C 216 71 208 82 194 82 C 180 82 172 71 172 55 C 172 39 180 28 194 28 Z" 
          fill="url(#emeraldDark)" />

    <!-- Letter 'N' -->
    <path d="M 266 110 L 266 0 L 296 0 L 340 68 L 340 0 L 366 0 L 366 110 L 336 110 L 292 42 L 292 110 Z" 
          fill="url(#emeraldDark)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <path d="M 266 110 L 266 0 L 296 0 L 340 68 L 340 0 L 366 0 L 366 110 L 336 110 L 292 42 L 292 110 Z" 
          fill="url(#emeraldDark)" />

    <!-- Letter 'E' (3 Gold Metallic Horizontal Bars with 3D Bevel) -->
    <!-- Top Bar -->
    <rect x="382" y="2" width="112" height="28" rx="6" fill="url(#goldBarsE)" stroke="#FFFFFF" stroke-width="6" />
    <line x1="386" y1="7" x2="490" y2="7" stroke="#FFFDF0" stroke-width="3" stroke-linecap="round" />
    <!-- Middle Bar -->
    <rect x="382" y="42" width="112" height="28" rx="6" fill="url(#goldBarsE)" stroke="#FFFFFF" stroke-width="6" />
    <line x1="386" y1="47" x2="490" y2="47" stroke="#FFFDF0" stroke-width="3" stroke-linecap="round" />
    <!-- Bottom Bar -->
    <rect x="382" y="82" width="112" height="28" rx="6" fill="url(#goldBarsE)" stroke="#FFFFFF" stroke-width="6" />
    <line x1="386" y1="87" x2="490" y2="87" stroke="#FFFDF0" stroke-width="3" stroke-linecap="round" />

    <!-- Letter 'V' with Golden Checkmark Arm Extending Upwards -->
    <path d="M 510 0 L 536 0 L 570 78 L 610 0 L 640 0 L 588 110 L 552 110 Z" 
          fill="url(#emeraldDark)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <path d="M 510 0 L 536 0 L 570 78 L 610 0 L 640 0 L 588 110 L 552 110 Z" 
          fill="url(#emeraldDark)" />
    <!-- Gold Checkmark Wing on 'V' -->
    <path d="M 552 110 L 588 110 L 664 -30 C 668 -36 658 -42 650 -37 L 570 78 Z" 
          fill="url(#goldHighlight)" stroke="#FFFFFF" stroke-width="4" />
    <line x1="562" y1="90" x2="656" y2="-30" stroke="#FFFBEB" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- ======================================================== -->
  <!-- 3. MIDDLE BANNER "Pelayanan Publik"                       -->
  <!-- ======================================================== -->
  <g id="banner-pelayanan-publik" transform="translate(65, 580)" filter="url(#shadow3D)">
    <!-- Outer Gold Frame -->
    <rect x="0" y="0" width="670" height="92" rx="46" fill="url(#goldLinear)" />
    <!-- Inner Dark Emerald Pill -->
    <rect x="7" y="7" width="656" height="78" rx="39" fill="url(#emeraldDark)" />
    <!-- Inner Fine Gold Rim -->
    <rect x="11" y="11" width="648" height="70" rx="35" fill="none" stroke="#FEF08A" stroke-width="2" opacity="0.6" />

    <!-- Clean Pristine Typography: "Pelayanan Publik" -->
    <text x="335" y="62" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="52" 
          font-weight="900" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="1.5">
      Pelayanan Publik
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- 4. BOTTOM SUB-RIBBON "— Kankemenag Gunungkidul —"          -->
  <!-- ======================================================== -->
  <g id="ribbon-kankemenag" transform="translate(135, 688)" filter="url(#shadow3D)">
    <!-- White Rounded Container with Gold Border -->
    <rect x="0" y="0" width="530" height="54" rx="27" fill="#FFFFFF" stroke="url(#goldLinear)" stroke-width="5" />

    <!-- Left & Right Gold Accent Lines -->
    <line x1="30" y1="27" x2="80" y2="27" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" />
    <line x1="450" y1="27" x2="500" y2="27" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" />

    <!-- Text: "Kankemenag Gunungkidul" -->
    <text x="265" y="37" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="25" 
          font-weight="800" 
          fill="#044e35" 
          text-anchor="middle" 
          letter-spacing="0.8">
      Kankemenag Gunungkidul
    </text>
  </g>
</svg>

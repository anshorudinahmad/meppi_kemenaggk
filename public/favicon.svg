<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="15%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="90%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>

    <linearGradient id="favGoldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="25%" stop-color="#CA8A04"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Emerald Gradients -->
    <linearGradient id="favEmeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="30%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="85%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="favEmeraldVibrant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="favDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#011f18" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Speech Bubble Pointer (Bottom-Left) -->
  <g filter="url(#favDropShadow)">
    <path d="M 215 390 L 140 470 C 132 478 145 487 155 478 L 265 415 Z" fill="url(#favGold)" />
    <path d="M 218 392 L 150 463 C 146 468 153 472 158 468 L 260 413 Z" fill="url(#favEmeraldDark)" />
  </g>

  <!-- Outer Gold Medal Ring -->
  <circle cx="260" cy="245" r="210" fill="none" stroke="url(#favGold)" stroke-width="26" filter="url(#favDropShadow)" />
  <circle cx="260" cy="245" r="197" fill="none" stroke="#FEF08A" stroke-width="3" opacity="0.8" />

  <!-- Emerald Crescent Shell Wrapping Top & Left -->
  <path d="M 70 245 A 190 190 0 0 1 405 125 A 190 190 0 0 0 100 345 Z" fill="url(#favEmeraldDark)" opacity="0.9" />

  <!-- Inner Emerald Ring -->
  <circle cx="260" cy="245" r="182" fill="url(#favEmeraldDark)" />
  <circle cx="260" cy="245" r="180" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.5" />

  <!-- Center White Background Disc -->
  <circle cx="260" cy="245" r="158" fill="#FFFFFF" />

  <!-- 3 Stylized Human Figures (Society / Stakeholders) -->
  <g opacity="0.95">
    <!-- Left Person -->
    <circle cx="198" cy="186" r="23" fill="url(#favEmeraldVibrant)" />
    <path d="M 162 265 C 162 218 226 218 226 265 Z" fill="url(#favEmeraldVibrant)" />

    <!-- Right Person -->
    <circle cx="318" cy="186" r="23" fill="url(#favEmeraldVibrant)" />
    <path d="M 282 265 C 282 218 350 218 350 265 Z" fill="url(#favEmeraldVibrant)" />
  </g>

  <!-- Center Person (Elevated & Prominent) -->
  <g filter="url(#favDropShadow)">
    <circle cx="260" cy="155" r="32" fill="url(#favEmeraldVibrant)" stroke="#FFFFFF" stroke-width="4.5" />
    <path d="M 215 265 C 215 205 305 205 305 265 Z" fill="url(#favEmeraldVibrant)" stroke="#FFFFFF" stroke-width="4.5" />
  </g>

  <!-- 3 Rising Performance Bars (Growth / Standard) -->
  <!-- Bar 1 (Left) -->
  <g filter="url(#favDropShadow)">
    <rect x="234" y="245" width="35" height="95" rx="6" fill="url(#favEmeraldVibrant)" stroke="url(#favGold)" stroke-width="3" />
    <path d="M 236 248 L 267 248" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Bar 2 (Middle) -->
  <g filter="url(#favDropShadow)">
    <rect x="281" y="202" width="38" height="138" rx="6" fill="url(#favEmeraldVibrant)" stroke="url(#favGold)" stroke-width="3.5" />
    <path d="M 283 206 L 317 206" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Bar 3 (Right, High) -->
  <g filter="url(#favDropShadow)">
    <rect x="331" y="155" width="42" height="185" rx="7" fill="url(#favEmeraldVibrant)" stroke="url(#favGold)" stroke-width="4" />
    <path d="M 333 159 L 371 159" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Grand 3D Golden Checkmark Swooping Outside Circle -->
  <g filter="url(#favDropShadow)">
    <path d="M 270 282 L 328 340 C 332 344 338 344 342 339 L 500 110 C 506 102 495 94 487 100 L 335 296 L 285 248 C 278 242 264 250 270 282 Z" 
          fill="url(#favGoldHighlight)" stroke="#FFFBEB" stroke-width="3.5" />
    <path d="M 280 268 L 335 322 L 492 105" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M 335 332 L 498 113" 
          fill="none" stroke="#854D0E" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
